spring.application.name=practica1barrosso
app.auth.username=${APP_AUTH_USERNAME}
app.auth.password=${APP_AUTH_PASSWORD}
app.auth.role=${APP_AUTH_ROLE:USER}
app.jwt.secret=${APP_JWT_SECRET}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${SERVER_SSL_KEY_STORE:file:certs/localhost.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD}
server.ssl.key-alias=localhost
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
